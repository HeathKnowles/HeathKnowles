name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

# Never let a manual run race a scheduled one on `git push`.
concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check GH_PAT secret
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Missing GH_PAT secret. Add a classic PAT with read:user (and repo for private contributions)."
            exit 1
          fi

      - name: Update stats in SVG
        env:
          # PAT is required: the default GITHUB_TOKEN cannot read the user's
          # full contribution graph (especially private contributions).
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/update-github-stats.js

      - name: Commit and push
        run: |
          if git diff --quiet -- assets/portfolio.svg; then
            echo "No changes detected — skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_COMMIT=$(git log -1 --format="%ct" -- assets/portfolio.svg 2>/dev/null || echo "0")
            NOW=$(date +%s)
            DIFF=$(( (NOW - LAST_COMMIT) / 86400 ))

            if [ "$DIFF" -lt 10 ]; then
              echo "Scheduled run: last commit was $DIFF day(s) ago. Skipping until 10 days have passed."
              exit 0
            fi

            echo "Scheduled run: $DIFF day(s) since last commit — pushing."
          else
            echo "Manual run — bypassing 10-day check."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio.svg
          git commit -m "chore: update github stats"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main
          done

          echo "::error::Could not push updated stats after 3 attempts."
          exit 1
